<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<!-- Animated Gallery -->
  <style>
  *{
     margin:0;
     padding:0;
     box-sizing: border-box;
  }
  body{
      height: 100vh;
      width:100vw;
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      
      
  }
  .main{
        display:flex;
        border-radius: 10px;
        height: 500px;
        width:80%;
        border:3px solid wheat;
       
  }
  .cards{
        height: 100%;

        width:80px;
        display: flex;
        align-items: center;
        flex:1;
        cursor: pointer;
        transition: all 5s;
        justify-content: center;
        border:3px solid wheat;
        color:wheat;
  }
  .cards:nth-child(even){
        background-color: blue;
  }
  .cards:nth-child(odd){
        background-color: brown;
  }
  .cards:hover{
         flex:3;
         transform:scale(1.2,1.2);
  }
  </style>
  
  </head>
  <body>
    <div class="main">
      <div class="cards">1</div>
      <div class="cards">2</div>
      <div class="cards">3</div>
      <div class="cards">4</div>
      <div class="cards">5</div>

    </div>
    
    
   

    
     
  
   
</body>
</html>
