<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <!--Mario Animation-->
    <style>
        *{
            margin:0;
            padding:0;
        }
      body{
        height:100vh;
        width:100%;
        background: url(/mario-bg.png);
        background-size:100% 100%;
      }
      div{
          position:absolute;
          bottom:35px;
          height:200px;
          width:200px;
          background: url(/mar1.png) no-repeat;
          background-size: 100% 100%;
          animation:anim1 1s linear infinite,anim2 2s linear infinite;
      }
      @keyframes anim1 {
        0%{
            background:url(/mar2.png) no-repeat;
            background-size:100% 100%;
        }
        20%{
            background:url(/mar3.png) no-repeat;
            background-size:100% 100%;
        }
        40%{
            background:url(/mar4.png)no-repeat;
            background-size:100% 100%;
        }
        60%{
            background:url(/mar5.png)no-repeat;
            background-size:100% 100%;
        }
        80%{
            background:url(/mar6.png)no-repeat;
            background-size:100% 100%;
        }
        100%{
            background:url(/mar7.png)no-repeat;
            background-size:100% 100%;
        }
      }
      @keyframes anim2 {
        from{
            right:100%;
        }
        to{
            right:-100%;
        }
        
      }
  
  
  </style>
    
</head>
<body> 
   <div></div>
</body>
</html>
